version: '3.8'

# Local testing environment for Railway deployment
# Use this to test the Railway Dockerfiles locally before deploying

services:
  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_DATABASE: huly
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Test the monolithic build
  huly-platform:
    build:
      context: ../
      dockerfile: railway/Dockerfile
    environment:
      NODE_ENV: development
      SERVER_SECRET: test-secret
      MONGO_URL: mongodb://mongodb:27017/huly
      DB_URL: mongodb://mongodb:27017/huly
      REDIS_URL: redis://redis:6379
      QUEUE_CONFIG: redis://redis:6379
      STORAGE_CONFIG: minio|huly-files|minio:9000|minioadmin|minioadmin
      FRONT_URL: http://localhost:8080
      ACCOUNTS_URL: http://localhost:3000
      TRANSACTOR_URL: ws://localhost:3333
      COLLABORATOR_URL: ws://localhost:3078
      PLATFORM_ADMIN_EMAILS: admin@test.com
    ports:
      - "8080:8080"
      - "3000:3000"
      - "3333:3333"
      - "3078:3078"
    depends_on:
      - mongodb
      - redis
      - minio

  # Test individual service builds (uncomment to test)
  # frontend:
  #   build:
  #     context: ../
  #     dockerfile: railway/Dockerfile.front
  #   environment:
  #     TRANSACTOR_URL: http://server:3333
  #     COLLABORATOR_URL: http://collaborator:3078
  #   ports:
  #     - "80:80"
  
  # account:
  #   build:
  #     context: ../
  #     dockerfile: railway/Dockerfile.account
  #   environment:
  #     NODE_ENV: development
  #     SERVER_SECRET: test-secret
  #     DB_URL: mongodb://mongodb:27017/huly
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - mongodb
  
  # server:
  #   build:
  #     context: ../
  #     dockerfile: railway/Dockerfile.server
  #   environment:
